name: Build and Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install FFmpeg (Gyan full build, matches build.bat)
        run: |
          winget install --id Gyan.FFmpeg --exact --source winget --accept-source-agreements --accept-package-agreements
        shell: pwsh

      - name: Add FFmpeg to PATH
        run: |
          $ffmpegExe = Get-ChildItem -Path "$env:LOCALAPPDATA\Microsoft\WinGet\Packages" -Filter "ffmpeg.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $ffmpegExe) {
            $ffmpegExe = Get-ChildItem -Path "C:\Program Files\WinGet\Packages" -Filter "ffmpeg.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $ffmpegExe) {
            Write-Error "ffmpeg.exe not found after winget install"
            exit 1
          }
          $ffmpegDir = $ffmpegExe.DirectoryName
          Write-Host "Found FFmpeg at: $ffmpegDir"
          Add-Content -Path $env:GITHUB_PATH -Value $ffmpegDir
        shell: pwsh

      - name: Verify FFmpeg on PATH
        run: |
          ffmpeg -version
          ffprobe -version
        shell: pwsh

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          python -m PyInstaller --clean --noconfirm GiffyPy.spec

      - name: Prepare distribution package
        run: |
          copy scripts\create_shortcut.bat dist\GiffyPy\
          powershell Compress-Archive -Path dist\GiffyPy -DestinationPath GiffyPy.zip

      - name: Generate Artifact Attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: "GiffyPy.zip"

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: GiffyPy.zip
          body_path: release_notes.md
          draft: false
          prerelease: false
